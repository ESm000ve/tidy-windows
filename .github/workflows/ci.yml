name: Windows verification
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npm run check:publish -- --history --build
      - run: node scripts/prepare-windows.mjs
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Tidy-Windows
          path: release/*Setup.exe
